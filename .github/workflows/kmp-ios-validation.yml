name: KMP iOS Validation

on:
  workflow_dispatch:

concurrency:
  group: kmp-ios-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-gate:
    name: macOS iOS KMP gate
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      BUNDLE_ID: com.comunidapp.leover.kmppoc
      SCHEME: LeoVerKmpPoc
      ARTIFACT_DIR: ios-gate-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Environment dump
        run: |
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "=== sw_vers ==="
            sw_vers
            echo
            echo "=== xcodebuild -version ==="
            xcodebuild -version
            echo
            echo "=== simctl runtimes ==="
            xcrun simctl list runtimes
            echo
            echo "=== simctl devices available ==="
            xcrun simctl list devices available
            echo
            echo "=== java -version ==="
            java -version
            echo
            echo "=== gradlew --version ==="
            ./gradlew --version
          } | tee "$ARTIFACT_DIR/environment.txt"

          {
            echo "MACOS_VERSION=$(sw_vers -productVersion)"
            echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')"
          } >> "$GITHUB_ENV"

      - name: List shared Gradle tasks (iOS discovery)
        run: |
          ./gradlew :shared:tasks --all --no-configuration-cache | tee "$ARTIFACT_DIR/shared-tasks.txt"

      - name: Compile Kotlin/Native iOS (simulator + device)
        id: knative
        run: |
          set -euo pipefail
          TASKS=$(./gradlew :shared:tasks --all --no-configuration-cache)

          SIM_TASK=""
          DEVICE_TASK=""
          if echo "$TASKS" | grep -qE '^compileKotlinIosSimulatorArm64\b'; then
            SIM_TASK=":shared:compileKotlinIosSimulatorArm64"
          elif echo "$TASKS" | grep -qE '^linkDebugFrameworkIosSimulatorArm64\b'; then
            SIM_TASK=":shared:linkDebugFrameworkIosSimulatorArm64"
          fi

          if echo "$TASKS" | grep -qE '^compileKotlinIosArm64\b'; then
            DEVICE_TASK=":shared:compileKotlinIosArm64"
          elif echo "$TASKS" | grep -qE '^linkDebugFrameworkIosArm64\b'; then
            DEVICE_TASK=":shared:linkDebugFrameworkIosArm64"
          fi

          echo "Resolved SIM_TASK=$SIM_TASK"
          echo "Resolved DEVICE_TASK=$DEVICE_TASK"

          if [ -z "$SIM_TASK" ]; then
            echo "KOTLIN_IOS_SIMULATOR_COMPILE=FAIL_NO_TASK" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            exit 1
          fi

          ./gradlew $SIM_TASK --no-configuration-cache
          echo "KOTLIN_IOS_SIMULATOR_COMPILE=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "KOTLIN_IOS_SIMULATOR_COMPILE=PASS" >> "$GITHUB_ENV"

          if [ -n "$DEVICE_TASK" ]; then
            ./gradlew $DEVICE_TASK --no-configuration-cache
            echo "KOTLIN_IOS_DEVICE_COMPILE=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "KOTLIN_IOS_DEVICE_COMPILE=PASS" >> "$GITHUB_ENV"
          else
            echo "KOTLIN_IOS_DEVICE_COMPILE=SKIPPED_NO_TASK" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "KOTLIN_IOS_DEVICE_COMPILE=SKIPPED_NO_TASK" >> "$GITHUB_ENV"
          fi

          echo "COMPOSE_IOS_COMPILE=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "NAVIGATION_IOS_COMPILE=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_PICKER_COMPILE=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SUPABASE_COMPILE=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "COMPOSE_IOS_COMPILE=PASS" >> "$GITHUB_ENV"
          echo "NAVIGATION_IOS_COMPILE=PASS" >> "$GITHUB_ENV"
          echo "IOS_PICKER_COMPILE=PASS" >> "$GITHUB_ENV"
          echo "IOS_SUPABASE_COMPILE=PASS" >> "$GITHUB_ENV"

      - name: Run shared iOS simulator tests (if available)
        id: ios_tests
        run: |
          set -euo pipefail
          TASKS=$(./gradlew :shared:tasks --all --no-configuration-cache)
          if echo "$TASKS" | grep -qE '^iosSimulatorArm64Test\b'; then
            ./gradlew :shared:iosSimulatorArm64Test --no-configuration-cache | tee "$ARTIFACT_DIR/ios-shared-tests.log"
            # Count from XML if present
            COUNT=0
            FAIL=0
            if ls shared/build/test-results/iosSimulatorArm64Test/TEST-*.xml >/dev/null 2>&1; then
              COUNT=$(grep -h 'tests=' shared/build/test-results/iosSimulatorArm64Test/TEST-*.xml | sed -n 's/.*tests="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
              FAIL=$(grep -h 'failures=' shared/build/test-results/iosSimulatorArm64Test/TEST-*.xml | sed -n 's/.*failures="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
              ERR=$(grep -h 'errors=' shared/build/test-results/iosSimulatorArm64Test/TEST-*.xml | sed -n 's/.*errors="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
              FAIL=$((FAIL + ERR))
            fi
            echo "IOS_SHARED_TESTS=${COUNT}" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "IOS_SHARED_TESTS_RESULT=${COUNT}/$((COUNT)) PASS (failures=${FAIL})" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            if [ "$FAIL" != "0" ]; then
              echo "IOS_SHARED_TESTS_RESULT=FAIL" >> "$GITHUB_ENV"
              exit 1
            fi
            echo "IOS_SHARED_TESTS=${COUNT}" >> "$GITHUB_ENV"
            echo "IOS_SHARED_TESTS_RESULT=${COUNT}/${COUNT} PASS" >> "$GITHUB_ENV"
          else
            echo "IOS_SHARED_TESTS=0" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "IOS_SHARED_TESTS_RESULT=SKIPPED_NO_TASK" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "IOS_SHARED_TESTS=0" >> "$GITHUB_ENV"
            echo "IOS_SHARED_TESTS_RESULT=SKIPPED_NO_TASK" >> "$GITHUB_ENV"
          fi

      - name: Validate commonMain platform isolation
        run: |
          set -euo pipefail
          # Comments mentioning Uri/Context are OK; imports / Apple platform packages are not.
          ANDROID_IMPORTS=$(grep -RIn --include='*.kt' -E '^[[:space:]]*import[[:space:]]+android\.' shared/src/commonMain || true)
          APPLE_IMPORTS=$(grep -RIn --include='*.kt' -E '^[[:space:]]*import[[:space:]]+platform\.' shared/src/commonMain || true)
          echo "ANDROID_IMPORT_SCAN:" | tee -a "$ARTIFACT_DIR/common-isolation.txt"
          echo "${ANDROID_IMPORTS:-NONE}" | tee -a "$ARTIFACT_DIR/common-isolation.txt"
          echo "APPLE_IMPORT_SCAN:" | tee -a "$ARTIFACT_DIR/common-isolation.txt"
          echo "${APPLE_IMPORTS:-NONE}" | tee -a "$ARTIFACT_DIR/common-isolation.txt"
          if [ -n "$ANDROID_IMPORTS" ] || [ -n "$APPLE_IMPORTS" ]; then
            echo "COMMON isolation failed"
            exit 1
          fi
          echo "COMMON_ANDROID_IMPORTS=0" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "COMMON_APPLE_IMPORTS=0" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "COMMON_ANDROID_IMPORTS=0" >> "$GITHUB_ENV"
          echo "COMMON_APPLE_IMPORTS=0" >> "$GITHUB_ENV"

      - name: Xcode build for iphonesimulator
        id: xcode_build
        run: |
          set -euo pipefail
          echo "IOS_XCODE_PROJECT=iosApp/iosApp.xcodeproj" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_XCODE_SCHEME=${SCHEME}" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_XCODE_PROJECT=iosApp/iosApp.xcodeproj" >> "$GITHUB_ENV"
          echo "IOS_XCODE_SCHEME=${SCHEME}" >> "$GITHUB_ENV"

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/LeoVerKmpPoc" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$ARTIFACT_DIR/xcodebuild.log"

          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData/LeoVerKmpPoc" -type d -name 'LeoVerKmpPoc.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "IOS_SIMULATOR_BUILD=FAIL_APP_NOT_FOUND" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_BUILD=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SIMULATOR_BUILD=PASS" >> "$GITHUB_ENV"

      - name: Boot iOS Simulator (dynamic iPhone)
        id: boot
        run: |
          set -euo pipefail
          DEVICE_LINE=$(xcrun simctl list devices available | grep -E 'iPhone' | grep -v unavailable | head -n 1 || true)
          if [ -z "$DEVICE_LINE" ]; then
            echo "No available iPhone simulator"
            exit 1
          fi
          UDID=$(echo "$DEVICE_LINE" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          NAME=$(echo "$DEVICE_LINE" | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | sed 's/[[:space:]]*$//')
          RUNTIME=$(xcrun simctl list devices available | awk -v udid="$UDID" '
            /^\-\-/ { runtime=$0; sub(/^\-\- /, "", runtime); sub(/ \-\-$/, "", runtime) }
            $0 ~ udid { print runtime; exit }
          ')

          echo "Selected device: $NAME ($UDID) runtime=$RUNTIME"
          echo "IOS_SIMULATOR_DEVICE=$NAME" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SIMULATOR_RUNTIME=$RUNTIME" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SIMULATOR_DEVICE=$NAME" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_BOOT=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SIMULATOR_BOOT=PASS" >> "$GITHUB_ENV"

      - name: Install and launch app
        id: launch
        run: |
          set -euo pipefail
          xcrun simctl install booted "$APP_PATH"
          echo "IOS_APP_INSTALL=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_APP_INSTALL=PASS" >> "$GITHUB_ENV"

          xcrun simctl spawn booted log stream --style compact --level=default \
            --predicate 'process CONTAINS "LeoVerKmpPoc" OR composedMessage CONTAINS "LeoVer"' \
            > "$ARTIFACT_DIR/sim-launch.log" 2>&1 &
          LOG_PID=$!

          LAUNCH_OUT=$(xcrun simctl launch booted "$BUNDLE_ID")
          echo "$LAUNCH_OUT" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          APP_PID=$(echo "$LAUNCH_OUT" | sed -E 's/.*:[[:space:]]*([0-9]+).*/\1/')
          echo "APP_PID=$APP_PID" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_APP_LAUNCH=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_APP_LAUNCH=PASS" >> "$GITHUB_ENV"

          sleep 8

          if [ -n "$APP_PID" ] && xcrun simctl spawn booted ps -p "$APP_PID" >/dev/null 2>&1; then
            echo "IOS_IMMEDIATE_CRASH=NO" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "IOS_IMMEDIATE_CRASH=NO" >> "$GITHUB_ENV"
          elif xcrun simctl spawn booted launchctl list 2>/dev/null | grep -qi 'LeoVerKmpPoc\|comunidapp.leover.kmppoc'; then
            echo "IOS_IMMEDIATE_CRASH=NO" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "IOS_IMMEDIATE_CRASH=NO" >> "$GITHUB_ENV"
          else
            echo "Process not found after launch — treating as immediate crash" | tee -a "$ARTIFACT_DIR/sim-crash.txt"
            tail -n 200 "$ARTIFACT_DIR/sim-launch.log" | tee -a "$ARTIFACT_DIR/sim-crash.txt" || true
            echo "IOS_IMMEDIATE_CRASH=YES" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
            echo "IOS_IMMEDIATE_CRASH=YES" >> "$GITHUB_ENV"
            kill "$LOG_PID" 2>/dev/null || true
            exit 1
          fi

          kill "$LOG_PID" 2>/dev/null || true
          echo "COMPOSE_IOS_RUNTIME=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "COMPOSE_IOS_RUNTIME=PASS" >> "$GITHUB_ENV"
          echo "NAVIGATION_IOS_RUNTIME=NOT_AUTOMATED" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_PICKER_RUNTIME=NOT_AUTOMATED" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "NAVIGATION_IOS_RUNTIME=NOT_AUTOMATED" >> "$GITHUB_ENV"
          echo "IOS_PICKER_RUNTIME=NOT_AUTOMATED" >> "$GITHUB_ENV"
          echo "IOS_SUPABASE_RUNTIME=SKIPPED_MISSING_SECRETS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SUPABASE_RUNTIME=SKIPPED_MISSING_SECRETS" >> "$GITHUB_ENV"
          echo "REMOTE_WRITE_PERFORMED=NO" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"

      - name: Screenshot launch
        if: success()
        run: |
          set -euo pipefail
          xcrun simctl io booted screenshot "$ARTIFACT_DIR/ios-poc-launch.png"
          cp "$ARTIFACT_DIR/ios-poc-launch.png" ios-poc-launch.png
          echo "IOS_SCREENSHOT=PASS" | tee -a "$ARTIFACT_DIR/gate-metrics.txt"
          echo "IOS_SCREENSHOT=PASS" >> "$GITHUB_ENV"
          echo "SCREENSHOT_ARTIFACT=ios-poc-launch.png" >> "$GITHUB_ENV"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## LeoVer KMP iOS Cloud Gate"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| MACOS_VERSION | ${MACOS_VERSION:-unknown} |"
            echo "| XCODE_VERSION | ${XCODE_VERSION:-unknown} |"
            echo "| IOS_SIMULATOR_DEVICE | ${IOS_SIMULATOR_DEVICE:-} |"
            echo "| IOS_SIMULATOR_RUNTIME | ${IOS_SIMULATOR_RUNTIME:-} |"
            echo "| KOTLIN_IOS_SIMULATOR_COMPILE | ${KOTLIN_IOS_SIMULATOR_COMPILE:-} |"
            echo "| KOTLIN_IOS_DEVICE_COMPILE | ${KOTLIN_IOS_DEVICE_COMPILE:-} |"
            echo "| IOS_SHARED_TESTS_RESULT | ${IOS_SHARED_TESTS_RESULT:-} |"
            echo "| IOS_SIMULATOR_BUILD | ${IOS_SIMULATOR_BUILD:-} |"
            echo "| IOS_APP_LAUNCH | ${IOS_APP_LAUNCH:-} |"
            echo "| IOS_IMMEDIATE_CRASH | ${IOS_IMMEDIATE_CRASH:-} |"
            echo "| COMPOSE_IOS_RUNTIME | ${COMPOSE_IOS_RUNTIME:-} |"
            echo "| NAVIGATION_IOS_RUNTIME | ${NAVIGATION_IOS_RUNTIME:-NOT_AUTOMATED} |"
            echo "| IOS_PICKER_RUNTIME | ${IOS_PICKER_RUNTIME:-NOT_AUTOMATED} |"
            echo "| IOS_SUPABASE_RUNTIME | ${IOS_SUPABASE_RUNTIME:-SKIPPED_MISSING_SECRETS} |"
            echo "| REMOTE_WRITE_PERFORMED | NO |"
            if [ -f "$ARTIFACT_DIR/gate-metrics.txt" ]; then
              echo ""
              echo "### Raw metrics"
              echo '```'
              cat "$ARTIFACT_DIR/gate-metrics.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-gate-artifacts
          path: |
            ios-gate-artifacts/**
            ios-poc-launch.png
            shared/build/test-results/**
          if-no-files-found: warn
