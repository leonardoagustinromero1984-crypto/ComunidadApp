name: Staging physical QA APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - cloud-integration/leover-20260927

concurrency:
  group: staging-physical-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  assemble-staging-debug:
    name: Assemble stagingDebug physical QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_STAGING_URL: https://tobqbddfcyitwgbkthhy.supabase.co

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble stagingDebug
        env:
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          LEOVER_STAGING_QA_KEYSTORE_B64: ${{ secrets.LEOVER_STAGING_QA_KEYSTORE_B64 }}
          LEOVER_STAGING_QA_STORE_PASSWORD: ${{ secrets.LEOVER_STAGING_QA_STORE_PASSWORD }}
          LEOVER_STAGING_QA_KEY_PASSWORD: ${{ secrets.LEOVER_STAGING_QA_KEY_PASSWORD }}
          LEOVER_STAGING_QA_KEY_ALIAS: ${{ secrets.LEOVER_STAGING_QA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 scripts/qa/write-staging-local-properties.py --require-signing
          git check-ignore -q local.properties
          chmod +x gradlew
          ./gradlew :app:assembleStagingDebug --no-configuration-cache --no-daemon

      - name: Copy physical QA APK
        run: |
          set -euo pipefail
          mkdir -p apk
          cp app/build/outputs/apk/staging/debug/app-staging-debug.apk apk/LeoVer-M08-Staging-physical-qa-final.apk
          git check-ignore -q apk/LeoVer-M08-Staging-physical-qa-final.apk

      - name: Verify package, staging target, and stable QA signing
        run: |
          set -euo pipefail
          python3 scripts/qa/verify-staging-physical-qa-apk.py apk/LeoVer-M08-Staging-physical-qa-final.apk

      - name: Upload staging physical QA APK
        uses: actions/upload-artifact@v4
        with:
          name: LeoVer-M08-Staging-physical-qa-final
          path: apk/LeoVer-M08-Staging-physical-qa-final.apk
          if-no-files-found: error
