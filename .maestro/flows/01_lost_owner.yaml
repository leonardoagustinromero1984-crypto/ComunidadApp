appId: ${APP_ID}
name: "LOST navigation smoke QA01"
tags:
  - community-care
  - lost
  - updated-ready
---
# UPDATED_READY. Mora is already reunified. This flow does not publish.
# A new LOST is 01b_lost_publish_fresh.yaml (NEEDS_FRESH_FIXTURE).
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA01_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- assertVisible: "Perdí a mi mascota"
- assertVisible: "Encontré un animal"
- assertVisible: "Ver mapa de alertas"
- assertNotVisible: "Tomar caso"
- tapOn: "Perdí a mi mascota"
- extendedWaitUntil:
    visible: "Foto *"
    timeout: 10000
- assertVisible: "Mascota LeoVer *"
- assertVisible: "QA - Mora"
- scrollUntilVisible:
    element: "Publicar"
    direction: DOWN
    timeout: 8000
- assertVisible: "Publicar"
- takeScreenshot: lost_form_mora_not_published
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Perdidos / Encontrados"
    timeout: 10000
- takeScreenshot: lost_navigation_smoke
