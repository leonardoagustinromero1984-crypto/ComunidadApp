appId: ${APP_ID}
name: "Notification list smoke QA01"
tags:
  - community-care
  - match
  - updated-ready
---
# UPDATED_READY. Opens the canonical in-app list. Mora is already confirmed,
# so this does not tap "Podría ser mi mascota". Mark-read stays unasserted (P1).
# The OS shade is physical QA, not this flow.
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA01_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-notifications.yaml
    env:
      APP_ID: ${APP_ID}
- assertVisible: "Notificaciones"
- assertNotVisible: "Podría ser mi mascota"
- takeScreenshot: notification_list_smoke
