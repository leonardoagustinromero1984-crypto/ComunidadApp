appId: ${APP_ID}
name: "FOUND navigation smoke QA02"
tags:
  - community-care
  - found
  - updated-ready
---
# UPDATED_READY. Does not publish a FOUND. The responder fixture is already
# IN_CARE and Mora's provisional FOUND is archived.
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA02_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- tapOn: "Encontré un animal"
- extendedWaitUntil:
    visible: "Foto *"
    timeout: 10000
- assertVisible: "Al publicar se crea una ficha provisional y una VitaCora. No te convierte en dueño: sos quien tiene al animal ahora."
- scrollUntilVisible:
    element: "Publicar"
    direction: DOWN
    timeout: 8000
- assertVisible: "Publicar"
- assertNotVisible: "Tomar caso"
- takeScreenshot: found_form_not_published
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "Perdidos / Encontrados"
    timeout: 10000
