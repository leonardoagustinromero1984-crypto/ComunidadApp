appId: ${APP_ID}
name: "Agenda read QA10"
tags:
  - community-care
  - agenda
  - updated-ready
---
# UPDATED_READY. Veterinary Agenda opens "Mis turnos".
# Does not create a turn and does not tap Confirmar or Atendido.
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA10_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/switch-profile.yaml
    env:
      APP_ID: ${APP_ID}
      CONTEXT_LABEL: "Veterinaria · QA - Veterinaria Centro"
- tapOn: "Agenda"
- extendedWaitUntil:
    visible: "Mis turnos"
    timeout: 15000
- assertNotVisible: "Nuevo turno"
- assertNotVisible: "Atendido"
- takeScreenshot: agenda_read
