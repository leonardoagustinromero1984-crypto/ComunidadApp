appId: ${APP_ID}
name: "Responder exclusions QA05 QA06 QA04 QA07"
tags:
  - community-care
  - exclusions
  - updated-ready
---
# UPDATED_READY. No actor claims the IN_CARE FOUND.
# QA06 is foster history and must not see FOUND responder claim actions.
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA05_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- assertNotVisible: "Tomar caso"
- takeScreenshot: qa05_lost_found
- runFlow:
    file: ../subflows/logout-person.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA06_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- assertNotVisible: "Tomar caso"
- assertNotVisible: "Animal recibido / En cuidado"
- takeScreenshot: qa06_not_found_responder
- tapOn: "Volver"
- tapOn: "Solicitudes de tránsito"
- extendedWaitUntil:
    visible: "Solicitudes de tránsito"
    timeout: 15000
- assertVisible: "tránsito finalizado"
- takeScreenshot: qa06_foster_not_claim
- runFlow:
    file: ../subflows/logout-person.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA04_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- assertNotVisible: "Tomar caso"
- takeScreenshot: qa04_no_claim_on_terminal_found
- runFlow:
    file: ../subflows/logout-person.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA07_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- assertNotVisible: "Tomar caso"
- takeScreenshot: qa07_no_claim_on_terminal_found
