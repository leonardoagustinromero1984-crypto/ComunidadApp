appId: ${APP_ID}
name: "FOUND IN_CARE read QA03"
tags:
  - community-care
  - claim
  - updated-ready
---
# UPDATED_READY. The pinned FOUND is already IN_CARE. QA03 is custodian, not OWNER.
# This flow does not tap "Tomar caso" or "Animal recibido / En cuidado".
- runFlow:
    file: ../subflows/login-person.yaml
    env:
      USERNAME: ${QA03_USERNAME}
      PASSWORD: ${QA_PASSWORD}
      CLEAR_STATE: "true"
      APP_ID: ${APP_ID}
- runFlow:
    file: ../subflows/open-lost-found.yaml
    env:
      APP_ID: ${APP_ID}
- tapOn: "Encontrados"
- assertNotVisible: "Tomar caso"
- scrollUntilVisible:
    element: "QA - Responder Path 12, CABA"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "Animal recibido / En cuidado"
- takeScreenshot: responder_in_care_list
- tapOn: "Ver mapa de alertas"
- runFlow:
    file: ../subflows/close-dialogs.yaml
    env:
      APP_ID: ${APP_ID}
- extendedWaitUntil:
    visible: "Mapa de alertas"
    timeout: 15000
- tapOn: "Lista"
- assertNotVisible: "Tomar caso"
- takeScreenshot: responder_alert_map_list
