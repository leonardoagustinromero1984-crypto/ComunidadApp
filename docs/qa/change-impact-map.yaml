# LeoVer change → suite map. Used by check-regression-coverage.ps1 and run-regression.ps1 -Affected.
# Paths are prefix or glob-style. First match wins per file; modules accumulate.
# maestro_required never auto-starts Maestro. It only flags the report.

version: 1
default_suite: FAST
maestro_auto: false

mappings:
  - id: AUTH
    paths:
      - app/src/main/java/com/comunidapp/app/domain/auth/
      - app/src/main/java/com/comunidapp/app/data/repository/SupabaseAuthRepository.kt
      - app/src/main/java/com/comunidapp/app/data/repository/AuthRepository.kt
      - app/src/main/java/com/comunidapp/app/viewmodel/LoginViewModel.kt
      - app/src/main/java/com/comunidapp/app/ui/screens/login/
      - app/src/main/java/com/comunidapp/app/domain/authorization/
    modules: [AUTH, SECURITY]
    suites: [FAST]
    gradle_tests:
      - com.comunidapp.app.domain.auth.*
      - com.comunidapp.app.domain.authorization.*
      - com.comunidapp.app.viewmodel.Auth*
      - com.comunidapp.app.data.repository.MockAuthRepositoryTest
    maestro_required: false

  - id: PERSON
    paths:
      - app/src/main/java/com/comunidapp/app/domain/user/
